services:
  db:
    image: postgres:16-alpine
    container_name: logimaster-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: logimaster
      POSTGRES_PASSWORD: logimaster
      POSTGRES_DB: logimaster
      TZ: Asia/Tokyo
    ports:
      - '5432:5432'
    volumes:
      - logimaster-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U logimaster -d logimaster']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  logimaster-db-data:
